name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Android loyihasini yaratish
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0a7a2f' --iconBackgroundColorDark '#055a21'
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Debug APK (telefonda sinash uchun)
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Release AAB (Play Market uchun)
        working-directory: android
        run: ./gradlew bundleRelease
      - name: AAB'ni imzolash
        id: sign
        if: env.HAS_KEY == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: bambuk-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: bambuk-release-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
