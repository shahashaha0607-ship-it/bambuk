<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#0a7a2f">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bambuk · HSK 1</title>
<style>
:root{--bg:#f1f8f2;--card:#fff;--ink:#0f2418;--mute:#5d7a69;--red:#0a7a2f;--red2:#055a21;--acc:#0a7a2f;--gold:#19c37d;--ok:#1f9d55;--no:#d64545;--line:#d5e8d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06150c;--card:#0f2418;--ink:#e6f5ea;--mute:#8fb09b;--line:#1d3a29;--red:#0f9d4a;--red2:#0a7a38;--acc:#3be585}}
:root[data-theme="dark"]{--bg:#06150c;--card:#0f2418;--ink:#e6f5ea;--mute:#8fb09b;--line:#1d3a29;--red:#0f9d4a;--red2:#0a7a38;--acc:#3be585}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 130px}
.zh{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:76px;line-height:1.1;font-weight:700;text-align:center}
.py{font-size:26px;text-align:center;color:var(--acc);font-weight:600;margin-top:6px}
.en{font-size:19px;text-align:center;margin-top:8px}
.pos{font-size:13px;text-align:center;color:var(--mute);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.hint{text-align:center;color:var(--mute);margin-top:12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px 20px;margin:12px 0;min-height:240px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 8px 24px rgba(8,70,30,.08);cursor:pointer}
.row{display:flex;gap:12px;justify-content:center;margin:14px 0}
.b{flex:1;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;background:var(--red);color:#fff}
.b:active{background:var(--red2)}.b.no{background:var(--no)}.b.ok{background:var(--ok)}
.b.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ic{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:26px}
.ic.mic{background:var(--red);border:0}.ic.on{animation:p 1s infinite}
@keyframes p{50%{transform:scale(1.15);box-shadow:0 0 0 12px rgba(10,122,47,.2)}}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:16px;font-size:18px;text-align:left}
.opt.right{border-color:var(--ok);background:rgba(31,157,85,.15)}.opt.wrong{border-color:var(--no);background:rgba(214,69,69,.15)}
.opts .opt .z{font-family:"Noto Serif SC","Songti SC",serif;font-size:28px}
#fb{text-align:center;min-height:28px;margin:8px 0;font-size:17px}
h1{font-size:28px;margin:8px 0 2px}h2{font-size:15px;color:var(--mute);margin:0 0 16px;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:26px}.st span{font-size:12px;color:var(--mute)}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:9px}
.menu{display:grid;gap:10px;margin-top:16px}
.menu button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:16px;font-size:17px;font-weight:700}
.menu small{display:block;font-weight:400;color:var(--mute);font-size:13px}.menu em{font-style:normal;font-size:30px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li .z{font-family:"Noto Serif SC","Songti SC",serif;font-size:26px;min-width:76px;font-weight:700}
.li div small{display:block;color:var(--mute);font-size:13px}.li .d{margin-left:auto;font-size:12px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0}.bub.a{background:rgba(10,122,47,.08);border-color:var(--acc)}
.zh.s{font-size:32px;text-align:left}.py.s{font-size:16px;text-align:left;margin-top:4px}.u{color:var(--mute);margin-top:6px}.ic.sm{width:44px;height:44px;font-size:18px;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0 8px;font-size:11px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--acc);font-weight:700}

body{background:radial-gradient(120% 55% at 50% -8%,rgba(25,195,125,.22),transparent 60%),var(--bg);background-attachment:fixed}
.card{border-radius:28px;box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 34px -12px rgba(8,70,30,.22)}
.b{background:linear-gradient(180deg,var(--red),var(--red2));box-shadow:0 8px 16px -8px rgba(10,122,47,.7)}
.b.no{background:linear-gradient(180deg,#e56767,var(--no))}.b.ok{background:linear-gradient(180deg,#34b96f,var(--ok))}
.b.ghost{background:var(--card);box-shadow:none;color:var(--ink)}
.hero{display:flex;align-items:center;gap:6px;margin:4px 0 6px}
.say{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 22px 6px;padding:12px 16px;font-size:15px;box-shadow:0 10px 24px -14px rgba(8,70,30,.4)}
.say b{display:block;font-family:"Noto Serif SC","Songti SC",serif;font-size:26px;color:var(--acc);line-height:1.2}
.fbp{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left}
.st{box-shadow:0 8px 20px -14px rgba(8,70,30,.5)}
.menu button{box-shadow:0 8px 20px -14px rgba(8,70,30,.5)}
.menu em{width:48px;height:48px;border-radius:16px;background:rgba(10,122,47,.10);color:var(--acc);display:grid;place-items:center;flex:none}
.menu em svg,nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;border:1px solid var(--line);border-radius:28px;padding:6px 4px;box-shadow:0 16px 34px -12px rgba(5,40,20,.4)}
nav button{padding:8px 0 6px;border-radius:20px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:rgba(10,122,47,.10)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}.brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;border:1px solid var(--line)}
.brand b{display:block;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}.brand span{font-size:12px;color:var(--mute)}
</style>
</head>

v.innerHTML=`<div class="brand"><img src="${LOGO}" alt=""><div><b>Bambuk</b><span>Yorqin Ta'lim · HSK 1</span></div></div><div class="hero">${panda('happy',104)}<div class="say"><b>你好!</b>${S.streak>1?`${S.streak} kun ketma-ket, ajoyib!`:"Bugun nechta so'z o'rganamiz?"}</div></div><h2 style="margin-top:8px">HSK 3.0 · 1-daraja · ${W.length} ta so'z</h2>
<div class="stats"><div class="st"><b>🔥 ${S.streak}</b><span>kun ketma-ket</span></div><div class="st"><b>⭐ ${S.xp}</b><span>XP ball</span></div><div class="st"><b>${l}</b><span>yodlandi</span></div></div>
<div class="bar"><i style="width:${l/W.length*100}%"></i></div><div class="hint" style="margin:0 0 4px">${l} / ${W.length} so'z yodlangan · ${s} tasi ko'rilgan</div>
<div class="menu"><button onclick="go('cards')"><em>${ic('cards')}</em><div>Kartalar<small>Iyeroglif, pinyin, talaffuz</small></div></button>
<button onclick="go('quiz')"><em>${ic('quiz')}</em><div>Test<small>Ma'nosini toping yoki eshitib tanlang</small></div></button>
<button onclick="go('speak')"><em>${ic('speak')}</em><div>Gapirish mashqi<small>Namunaviy savol-javob suhbatlari</small></div></button></div>`}
let cur,flip=false;
function cardsV(){cur=next();flip=false;dc()}
function dc(){v.innerHTML=`<div class="card" onclick="fl()"><div class="zh">${cur.zh}</div>${flip?`<div class="py">${esc(cur.py)}</div><div class="en">${esc(cur.uz)}</div>${cur.en?`<div class="pos" style="text-transform:none">${esc(cur.en)}</div>`:''}`:`<div class="hint">Ma'nosini ko'rish uchun bosing</div>`}</div>
<div class="row"><button class="ic" onclick="say(cur.zh)">🔊</button></div>
<div class="row"><button class="b no" onclick="rt(0)">Bilmayman</button><button class="b ok" onclick="rt(1)">Bilaman</button></div>`}
function fl(){flip=!flip;dc();if(flip)say(cur.zh)}
function rt(k){up(cur,k,5);cur=next();flip=false;dc()}
let q;
function quizV(){const w=next(),listen=Math.random()<.35,o=[w];while(o.length<4){const x=W[Math.random()*W.length|0];if(!o.includes(x)&&x.uz!==w.uz&&(listen?x.zh!==w.zh:true))o.push(x)}
o.sort(()=>Math.random()-.5);q={w,listen,o,done:false};dq();if(listen)say(w.zh)}
function dq(){v.innerHTML=`<div class="card" style="min-height:170px;cursor:default">${q.listen?`<div class="zh">🎧</div><div class="hint">Eshiting va to'g'ri iyeroglifni tanlang</div>`:`<div class="zh">${q.w.zh}</div><div class="hint">${esc(q.w.py)}</div>`}</div>
${q.listen?'<div class="row"><button class="ic" onclick="say(q.w.zh)">🔊</button></div>':''}
<div class="opts">${q.o.map((x,i)=>`<button class="opt" id="o${i}" onclick="an(${i})">${q.listen?`<span class="z">${x.zh}</span>`:esc(short(x.uz))}</button>`).join('')}</div><div id="fb"></div>`}
function an(i){if(q.done)return;q.done=true;const ok=q.o[i]===q.w;up(q.w,ok,10);q.o.forEach((x,j)=>{const b=document.getElementById('o'+j);if(x===q.w)b.classList.add('right');else if(j===i)b.classList.add('wrong')});
document.getElementById('fb').innerHTML=`<div class="fbp">${panda(ok?'cheer':'oops',80)}<div>${ok?'To\'g\'ri! +10 XP':'Xato, hechqisi yo\'q'}<br><b>${q.w.zh}</b> · ${esc(q.w.py)} · ${esc(short(q.w.uz))}</div></div><div class="row"><button class="b" onclick="quizV()">Keyingisi →</button></div>`;say(q.w.zh)}
const D=[
["Tanishuv",["你好！你叫什么名字？","nǐ hǎo! nǐ jiào shénme míngzi?","Salom! Ismingiz nima?"],["你好，我叫李明。","nǐ hǎo, wǒ jiào Lǐ Míng.","Salom, mening ismim Li Ming."]],
["Tanishuv",["你好吗？","nǐ hǎo ma?","Yaxshimisiz?"],["我很好，谢谢。你呢？","wǒ hěn hǎo, xièxie. nǐ ne?","Yaxshiman, rahmat. O'zingiz-chi?"]],
["Tanishuv",["你是学生吗？","nǐ shì xuésheng ma?","Siz talabamisiz?"],["是，我是大学生。","shì, wǒ shì dàxuéshēng.","Ha, men universitet talabasiman."]],
["Tanishuv",["你是哪国人？","nǐ shì nǎ guó rén?","Siz qaysi davlatdansiz?"],["我是乌兹别克斯坦人。","wǒ shì Wūzībiékèsītǎn rén.","Men o'zbekistonlikman."]],
["Tanishuv",["你今年多大？","nǐ jīnnián duō dà?","Necha yoshdasiz?"],["我今年二十岁。","wǒ jīnnián èrshí suì.","Men bu yil yigirma yoshdaman."]],
["Oila",["你家有几口人？","nǐ jiā yǒu jǐ kǒu rén?","Oilangizda necha kishi bor?"],["我家有五口人。","wǒ jiā yǒu wǔ kǒu rén.","Oilamda besh kishi bor."]],
["Oila",["你有哥哥吗？","nǐ yǒu gēge ma?","Akangiz bormi?"],["有，我有一个哥哥。","yǒu, wǒ yǒu yí gè gēge.","Ha, bitta akam bor."]],
["Ovqat",["你喜欢吃什么？","nǐ xǐhuan chī shénme?","Nima yeyishni yoqtirasiz?"],["我喜欢吃饺子。","wǒ xǐhuan chī jiǎozi.","Men chuchvara yeyishni yaxshi ko'raman."]],
["Ovqat",["你想喝什么？","nǐ xiǎng hē shénme?","Nima ichmoqchisiz?"],["我想喝茶。","wǒ xiǎng hē chá.","Men choy ichmoqchiman."]],
["Xarid",["这个多少钱？","zhège duōshao qián?","Bu qancha turadi?"],["十块钱，很便宜。","shí kuài qián, hěn piányi.","O'n yuan, juda arzon."]],
["Vaqt va ob-havo",["现在几点？","xiànzài jǐ diǎn?","Hozir soat nechchi?"],["现在八点。","xiànzài bā diǎn.","Hozir soat sakkiz."]],
["Vaqt va ob-havo",["今天天气怎么样？","jīntiān tiānqì zěnmeyàng?","Bugun ob-havo qanday?"],["今天很热，不下雨。","jīntiān hěn rè, bú xià yǔ.","Bugun juda issiq, yomg'ir yo'q."]],
["Vaqt va ob-havo",["明天你做什么？","míngtiān nǐ zuò shénme?","Ertaga nima qilasiz?"],["明天我去看电影。","míngtiān wǒ qù kàn diànyǐng.","Ertaga kino ko'rgani boraman."]],
["Ish va o'qish",["你在哪儿工作？","nǐ zài nǎr gōngzuò?","Qayerda ishlaysiz?"],["我在公司工作。","wǒ zài gōngsī gōngzuò.","Men kompaniyada ishlayman."]],
["Ish va o'qish",["你会说汉语吗？","nǐ huì shuō Hànyǔ ma?","Xitoycha gapira olasizmi?"],["我会说一点儿汉语。","wǒ huì shuō yìdiǎnr Hànyǔ.","Men ozgina xitoycha gapira olaman."]],
["Ish va o'qish",["你住在哪里？","nǐ zhù zài nǎlǐ?","Qayerda yashaysiz?"],["我住在这里。","wǒ zhù zài zhèlǐ.","Men shu yerda yashayman."]],
["Odob",["谢谢！","xièxie!","Rahmat!"],["不客气。","bú kèqi.","Arzimaydi."]],
["Odob",["对不起！","duìbuqǐ!","Kechirasiz!"],["没关系。","méi guānxi.","Hechqisi yo'q."]],
["Odob",["再见！","zàijiàn!","Xayr!"],["再见，明天见。","zàijiàn, míngtiān jiàn.","Xayr, ertagacha."]]
];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let di=0,sh=false,fbk='';
function speakV(){sh=false;fbk='';dd(true)}
function nx(k){di=(di+k+D.length)%D.length;speakV()}
function dd(auto){const d=D[di],a=D[di][2];
v.innerHTML=`<div class="hint">${esc(d[0])} · ${di+1} / ${D.length}</div>
<div style="display:flex;margin-bottom:-4px">${panda(sh?'happy':'talk',76)}</div><div class="bub"><div class="zh s">${d[1][0]}</div><div class="py s">${esc(d[1][1])}</div><div class="u">${esc(d[1][2])}</div><button class="ic sm" onclick="say(D[di][1][0])">🔊</button></div>
${sh?`<div class="bub a"><div class="zh s">${a[0]}</div><div class="py s">${esc(a[1])}</div><div class="u">${esc(a[2])}</div></div>
<div class="row"><button class="ic" onclick="say(D[di][2][0])">🔊</button><button class="ic mic" id="mic" onclick="rec()">🎤</button></div><div class="hint">Tinglang, so'ng mikrofonni bosib javobni ayting</div><div id="fb">${fbk}</div>`
:`<div class="row"><button class="b" onclick="sh=true;dd()">Namunaviy javobni ko'rish</button></div><div class="hint">Avval o'zingiz javob bering, keyin tekshiring</div>`}
<div class="row"><button class="b ghost" onclick="nx(-1)">← Oldingi</button><button class="b ghost" onclick="nx(1)">Keyingi →</button></div>`;
if(auto)say(d[1][0])}
function done(p){if(p){S.xp+=15}tick();save()}
function selfc(){fbk=`Brauzer ovozni tanimaydi. Baland ayting va o'zingizni baholang:<div class="row"><button class="b no" onclick="nx(0)">Qiyin</button><button class="b ok" onclick="done(1);nx(1)">Aytdim +15 XP</button></div>`;dd()}
function rec(){if(!SR)return selfc();const r=new SR();r.lang='zh-CN';r.maxAlternatives=5;r.interimResults=false;
document.getElementById('mic').classList.add('on');
r.onresult=e=>{const n=s=>s.replace(/[\s，。,.!?！？]/g,'');const A=n(D[di][2][0]);const t=[...e.results[0]].map(x=>n(x.transcript));
let best=0;t.forEach(x=>{best=Math.max(best,[...A].filter(c=>x.includes(c)).length/A.length)});const p=Math.round(best*100);
if(best>=.8){done(1);fbk=`<div class="fbp">${panda('cheer',72)}<div>Ajoyib! Aniqlik ${p}% · +15 XP<br>Eshitildi: <b>${esc(t[0])}</b></div></div>`}
else if(best>=.5){done(0);fbk=`<div class="fbp">${panda('happy',72)}<div>Yaxshi, ${p}%. Yana bir bor urinib ko'ring.<br>Eshitildi: <b>${esc(t[0])}</b></div></div>`}
else{done(0);fbk=`<div class="fbp">${panda('oops',72)}<div>Aniqlik ${p}%. Avval 🔊 ni tinglang va qaytaring.<br>Eshitildi: <b>${esc(t[0])}</b></div></div>`}dd()};
r.onerror=()=>{fbk='Mikrofon ishlamadi. Ruxsatni tekshiring.';dd()};
r.onend=()=>{const x=document.getElementById('mic');if(x)x.classList.remove('on')};
try{r.start()}catch(e){selfc()}}
function listV(){v.innerHTML=`<h1>So'zlar</h1><input id="sq" placeholder="Qidirish: 好, hao, yaxshi…" oninput="fl2()"><div id="ls"></div>`;fl2()}
function fl2(){const t=document.getElementById('sq').value.toLowerCase().trim();const a=W.filter(w=>!t||w.zh.includes(t)||w.py.toLowerCase().includes(t)||w.en.toLowerCase().includes(t)||w.uz.toLowerCase().includes(t));
document.getElementById('ls').innerHTML=a.map(w=>{const b=S.box[w.n];return `<div class="li" onclick="say('${w.zh}')"><span class="z">${w.zh}</span><div>${esc(w.py)}<small>${esc(short(w.uz))}</small></div><span class="d">${b===undefined?'⚪':b>=3?'🟢':'🟡'}</span></div>`}).join('')}
go('home');
</script>
